# Конфигурация Narezka OS — BAZA.md §46
#
# Профиль это пресет «скорость против качества», а не описание железа:
# оба профиля запускаются на любой машине, отличается время выполнения (§62).

profile: auto            # auto | dev | batch
device: auto             # auto | cpu | cuda
degrade_gracefully: true # нет ускорителя → меньшая модель, пропуск опциональных стадий
download:
  # Для анализа больше 720p не нужно: кадрирование и субтитры считаются
  # по пропорциям, а не по деталям. 8 часов 1080p60 это десятки ГБ (§65).
  max_height: 720

storage_root: storage
default_project: default

stt:
  model: large-v3
  compute_type: auto     # auto подбирает int8 / float16 под устройство
  language: auto
  batch_size: 8

llm:
  # openrouter — бесплатные модели, ключ из OPENROUTER_API_KEY
  # openai     — платно и быстро, ключ из OPENAI_API_KEY
  #
  # Замер на пятичасовой записи: ~112 000 токенов входа и ~14 000 выхода
  # на одну запись целиком. В деньгах это около $0.01 на gpt-5-nano,
  # $0.03 на gpt-4o-mini и около $0.50 на gpt-5.4. Протокол один и тот же,
  # поэтому переход — это две строки здесь и ключ в .env.
  provider: openrouter
  # Имя модели меняется вместе с каталогом провайдера — актуальные бесплатные
  # варианты показывает `narezka models`. Ключ берётся из OPENROUTER_API_KEY
  # (файл .env, он в .gitignore).
  #
  # Выбрано под нашу задачу: разбор русского транскрипта с ответом по схеме.
  # Gemma 4 — многоязычная модель Google с окном 262K и режимом рассуждения.
  #
  # Выбор по замеру доступности, а не по бумажным характеристикам: нет смысла
  # в сильной модели, которая не отвечает. Три запроса подряд на каждую —
  # nemotron-3-super и gemma-4-26b дали 3 из 3, gemma-4-31b и gpt-oss — 0-1.
  # Из доступных nemotron-3-super крупнее: 120B против 25B.
  model: nvidia/nemotron-3-super-120b-a12b:free
  # Куда переключиться, если основная занята. У бесплатных моделей отказ
  # по занятости — обычное состояние, а не сбой.
  fallback_models:
    - google/gemma-4-26b-a4b-it:free
    - google/gemma-4-31b-it:free
  batch_mode: true       # пакетная обработка кандидатов — вдвое дешевле (§25)
  cache_prefix: true     # общий префикс промпта в кэше (§25)
  timeout_seconds: 120
  max_retries: 2

detector:
  backend: mediapipe     # mediapipe | yolox | ultralytics — выбор после сравнения (§17)

output:
  short:
    width: 1080
    height: 1920
    min_duration: 15
    optimal_duration: 60
    max_duration: 90
  # Как исходный кадр вписывается в вертикальный (§17, §61).
  # Обрезка по бокам и высота содержимого — один параметр: чем уже кадр после
  # обрезки, тем выше он выглядит. Для 16:9 в 9:16:
  #   full     0% обрезки  → содержимое занимает 32% высоты
  #   balanced 25%         → 42%
  #   focus    50%         → 63%
  #   fill     68%         → 100%, кадр заполнен целиком
  framing:
    # single — исходник целиком на подложке; split — лицо стримера сверху,
    # приближённый контент снизу. Сплит работает там, где стадия facecam
    # нашла вебку наложением (§61).
    layout: single
    preset: balanced       # full | balanced | focus | fill | custom
    side_crop: 0.25        # используется при preset: custom
    anchor: center         # center | left | right
    background: blur       # blur | color
    blur_sigma: 28         # 0 отключает размытие
    color: "0x14171c"

  loudness_target_lufs: -14
  fps: 30              # кадров/с на выходе; пусто — как в исходнике
  encoder: cpu          # cpu — качество лучше | gpu — быстрее на 40%
  crf: 20
  pix_fmt: yuv420p
  faststart: true

subtitles:
  style: STYLE_1          # STYLE_1 | STYLE_2 | STYLE_3 (§18)

candidates:
  window_seconds: 1.0
  # Вклад сигналов. Чат — прямое свидетельство реакции зрителей и не зависит
  # от громкости: тихая, но неожиданная сцена даёт всплеск сообщений при ровном
  # звуке. Когда чата нет, его вес распределяется между остальными (§41).
  loudness_weight: 0.45
  density_weight: 0.25
  chat_weight: 0.30
  chat_lead_seconds: 12     # окно реакции считается вперёд: замер дал плато 15-20 с
  chat_include_bots: false  # боты пишут по расписанию, а не на происходящее
  # Зрители здороваются на старте трансляции, а не в ответ на происходящее,
  # и всплеск приходится на пустое место. Отключается: у кого-то начало
  # и есть содержание.
  #
  # Три минуты, а не одна: замер на записи показал, что приветствие звучит
  # на третьей минуте — ведущий сначала возится с техникой. Окно безопаснее,
  # чем кажется: глушится только сигнал чата, а громкость и плотность речи
  # продолжают работать, поэтому яркий момент в начале всё равно найдётся.
  chat_ignore_start: true
  chat_ignore_start_seconds: 180
  min_peak_score: 0.8       # порог локального максимума, в единицах устойчивого z
  min_gap_seconds: 20       # чтобы один всплеск не дал десяток кандидатов
  max_coverage: 0.3         # потолок доли материала в кандидатах

funnel:
  max_candidates: 200
  max_clips: 30
  dedup_overlap: 0.5     # перекрытие, при котором кандидат отбрасывается
  chunk_seconds: 1200
  chunk_overlap_seconds: 60

score:
  schema_version: 2
  weights:
    semantic: 0.25
    emotion: 0.20
    context: 0.20
    completeness: 0.15
    audio: 0.10
    novelty: 0.05
    visual: 0.05

compilation:
  target_minutes: 20

# Переопределения профилей накладываются поверх значений выше.
profiles:
  dev:
    stt:
      # Замерено на фикстурах: base даёт RTF 0.12, но на русском ошибается так,
      # что текст становится бессмысленным («Осень в столице» → «80 лица»).
      # small — RTF 0.28 и разборчивый текст; для цикла разработки это
      # правильный размен (§62).
      model: small
      compute_type: int8
      batch_size: 4

  batch:
    stt:
      model: large-v3
      compute_type: auto
      batch_size: 16
