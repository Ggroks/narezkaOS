# Запуск сервисом одной командой: docker compose up -d
#
# Наружу порт не выставляется — только на локальный адрес машины. Снаружи
# сервис открывается туннелем или обратным прокси с сертификатом: отдавать
# его в интернет напрямую по http значит слать пароли открытым текстом.

services:
  narezka:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Хранилище: записи, ролики, база с учётками и счетами.
      - ./storage:/data
      # Конфиг снаружи, чтобы менять цены и настройки без пересборки образа.
      - ./configs:/app/configs:ro
      # Веса моделей распознавания — сотни мегабайт, качаются один раз.
      - narezka-models:/root/.cache/huggingface
    env_file:
      # Ключ к модели и прочие тайны. Файл в репозиторий не попадает.
      - .env
    # Обработка съедает все ядра: без предела соседи по машине встанут.
    # Числа под свою машину, у нас шесть ядер и 14 ГБ.
    deploy:
      resources:
        limits:
          cpus: "5"
          memory: 10g

volumes:
  narezka-models:
