[project]
name = "narezka"
version = "0.1.0"
description = "AI-монтажёр: длинное видео и Twitch VOD в Shorts и компиляции"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # httpx[socks] нужен huggingface_hub при SOCKS-прокси в окружении
    "httpx[socks]>=0.27",
]

[project.optional-dependencies]
pipeline = [
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1",
]
dev = ["pytest>=8.3"]

[project.scripts]
narezka = "narezka.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["narezka"]

[tool.pytest.ini_options]
testpaths = ["tests"]
